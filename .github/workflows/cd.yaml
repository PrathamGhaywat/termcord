name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: termcord-linux
            binary_name: termcord
          - os: macos-latest
            artifact_name: termcord-macos
            binary_name: termcord
          - os: windows-latest
            artifact_name: termcord-windows.exe
            binary_name: termcord.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2

      - name: Build
        shell: bash
        run: nim c -d:release --opt:speed -o:"bin/${{ matrix.binary_name }}" src/main.nim

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bin/${{ matrix.binary_name }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 bin/${{ matrix.binary_name }}
