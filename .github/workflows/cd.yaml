name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: termcord-linux-x64
          - os: ubuntu-24.04-arm
            artifact_name: termcord-linux-arm64
          - os: macos-latest
            artifact_name: termcord-macos-arm64
          - os: windows-latest
            artifact_name: termcord-windows-x64.exe
          - os: windows-11-arm
            artifact_name: termcord-windows-arm64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2

      - name: Build
        shell: bash
        run: nim c -d:release --opt:speed -o:"bin/${{ matrix.artifact_name }}" src/main.nim

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bin/${{ matrix.artifact_name }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_name="${{ github.ref_name }}"
          cp "bin/${{ matrix.artifact_name }}" "bin/$release_name-${{ matrix.artifact_name }}"
          gh release upload "$release_name" "bin/$release_name-${{ matrix.artifact_name }}"
